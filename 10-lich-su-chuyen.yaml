openapi: 3.0.3
info:
  title: CAB System API - Xem lịch sử chuyến
  description: API Xem lịch sử chuyến.
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Authentication
- name: Customer
- name: Driver
- name: Trip
- name: Payment
- name: Rating
- name: Operator
- name: Report
paths:
  /trips:
    get:
      tags:
      - Trip
      summary: Xem lịch sử chuyến
      parameters:
      - name: status
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: Danh sách chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListResponse'
components:
  schemas:
    Location:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        address:
          type: string
    TripResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            trip_id:
              type: string
            customer_id:
              type: string
            driver_id:
              type: string
              nullable: true
            status:
              type: string
            vehicle_type:
              type: string
            pickup:
              $ref: '#/components/schemas/Location'
            destination:
              $ref: '#/components/schemas/Location'
            fare_amount:
              type: number
              nullable: true
            created_at:
              type: string
              format: date-time
    TripListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/TripResponse'
        meta:
          type: object
          properties:
            page:
              type: integer
            page_size:
              type: integer
            total:
              type: integer
