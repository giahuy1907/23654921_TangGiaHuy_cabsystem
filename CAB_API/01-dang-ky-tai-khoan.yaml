openapi: 3.0.3
info:
  title: CAB System API - Đăng ký tài khoản
  description: API Đăng ký tài khoản.
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Authentication
- name: Customer
- name: Driver
- name: Trip
- name: Payment
- name: Rating
- name: Operator
- name: Report
paths:
  /auth/register:
    post:
      tags:
      - Authentication
      summary: Đăng ký tài khoản
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '409':
          description: Email hoặc số điện thoại đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    RegisterRequest:
      type: object
      required:
      - role
      - full_name
      - phone
      - email
      - password
      properties:
        role:
          type: string
          enum:
          - CUSTOMER
          - DRIVER
        full_name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
