openapi: 3.0.3
info:
  title: CAB System API - Thanh toán chuyến
  description: API Thanh toán chuyến.
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Authentication
- name: Customer
- name: Driver
- name: Trip
- name: Payment
- name: Rating
- name: Operator
- name: Report
paths:
  /trips/{trip_id}/payments:
    post:
      tags:
      - Payment
      summary: Thanh toán chuyến
      parameters:
      - name: trip_id
        in: path
        required: true
        description: ID của trip_id
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Tạo giao dịch thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '409':
          description: Không thể thanh toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    PaymentRequest:
      type: object
      required:
      - method
      properties:
        method:
          type: string
          enum:
          - CASH
          - ELECTRONIC
        provider:
          type: string
          nullable: true
    PaymentResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            payment_id:
              type: string
            trip_id:
              type: string
            method:
              type: string
            amount:
              type: number
            currency:
              type: string
            status:
              type: string
            provider_reference:
              type: string
              nullable: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
