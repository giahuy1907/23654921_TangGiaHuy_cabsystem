openapi: 3.0.3
info:
  title: CAB System API - Theo dõi chuyến đang diễn ra
  description: API Theo dõi chuyến đang diễn ra.
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Authentication
- name: Customer
- name: Driver
- name: Trip
- name: Payment
- name: Rating
- name: Operator
- name: Report
paths:
  /admin/trips/active:
    get:
      tags:
      - Operator
      summary: Theo dõi chuyến đang diễn ra
      responses:
        '200':
          description: Danh sách chuyến đang diễn ra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListResponse'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Location:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        address:
          type: string
    TripResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            trip_id:
              type: string
            customer_id:
              type: string
            driver_id:
              type: string
              nullable: true
            status:
              type: string
            vehicle_type:
              type: string
            pickup:
              $ref: '#/components/schemas/Location'
            destination:
              $ref: '#/components/schemas/Location'
            fare_amount:
              type: number
              nullable: true
            created_at:
              type: string
              format: date-time
    TripListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/TripResponse'
        meta:
          type: object
          properties:
            page:
              type: integer
            page_size:
              type: integer
            total:
              type: integer
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
