openapi: 3.0.3
info:
  title: CAB System API - Báo cáo doanh thu
  description: API Báo cáo doanh thu.
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Authentication
- name: Customer
- name: Driver
- name: Trip
- name: Payment
- name: Rating
- name: Operator
- name: Report
paths:
  /reports/revenue:
    get:
      tags:
      - Report
      summary: Báo cáo doanh thu
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Báo cáo doanh thu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueReportResponse'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    RevenueReportResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            currency:
              type: string
              example: VND
            gross_revenue:
              type: number
            cash_revenue:
              type: number
            electronic_revenue:
              type: number
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
