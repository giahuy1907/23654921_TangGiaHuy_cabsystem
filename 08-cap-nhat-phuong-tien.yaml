openapi: 3.0.3
info:
  title: CAB System API - Cập nhật phương tiện
  description: API Cập nhật phương tiện.
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Authentication
- name: Customer
- name: Driver
- name: Trip
- name: Payment
- name: Rating
- name: Operator
- name: Report
paths:
  /drivers/me/vehicle:
    put:
      tags:
      - Driver
      summary: Cập nhật phương tiện
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
components:
  schemas:
    VehicleRequest:
      type: object
      required:
      - vehicle_type
      - plate_number
      properties:
        vehicle_type:
          type: string
        brand:
          type: string
        model:
          type: string
        plate_number:
          type: string
        color:
          type: string
    VehicleResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id:
              type: string
            vehicle_type:
              type: string
            brand:
              type: string
            model:
              type: string
            plate_number:
              type: string
            color:
              type: string
