openapi: 3.0.3
info:
  title: CAB System API - Tài xế chấp nhận chuyến
  description: API Tài xế chấp nhận chuyến.
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Authentication
- name: Customer
- name: Driver
- name: Trip
- name: Payment
- name: Rating
- name: Operator
- name: Report
paths:
  /trips/{trip_id}/accept:
    post:
      tags:
      - Trip
      summary: Tài xế chấp nhận chuyến
      parameters:
      - name: trip_id
        in: path
        required: true
        description: ID của trip_id
        schema:
          type: string
      responses:
        '200':
          description: Chấp nhận thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '409':
          description: Không thể nhận chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Location:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        address:
          type: string
    TripResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            trip_id:
              type: string
            customer_id:
              type: string
            driver_id:
              type: string
              nullable: true
            status:
              type: string
            vehicle_type:
              type: string
            pickup:
              $ref: '#/components/schemas/Location'
            destination:
              $ref: '#/components/schemas/Location'
            fare_amount:
              type: number
              nullable: true
            created_at:
              type: string
              format: date-time
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
