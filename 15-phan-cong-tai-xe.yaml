openapi: 3.0.3
info:
  title: CAB System API - Phân công tài xế
  description: API Phân công tài xế.
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Authentication
- name: Customer
- name: Driver
- name: Trip
- name: Payment
- name: Rating
- name: Operator
- name: Report
paths:
  /trips/{trip_id}/matching/dispatch:
    post:
      tags:
      - Trip
      summary: Phân công tài xế
      parameters:
      - name: trip_id
        in: path
        required: true
        description: ID của trip_id
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchRequest'
      responses:
        '202':
          description: Đã gửi yêu cầu cho tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '409':
          description: Tài xế không khả dụng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    DispatchRequest:
      type: object
      required:
      - driver_id
      properties:
        driver_id:
          type: string
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
